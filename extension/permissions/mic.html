<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>G-Axis Mic</title>
  <style>
    body { margin: 0; padding: 16px; font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #e0e0e0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .label { font-size: 14px; font-weight: 500; }
    #status { font-size: 12px; color: #888; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #34a853; display: inline-block; animation: pulse 1.5s infinite; margin-right: 6px; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  </style>
</head>
<body>
  <div class="label"><span class="dot"></span>G-Axis Mic</div>
  <div id="status">Starting...</div>
  <script src="mic.js"></script>
</body>
</html>
