<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>G-Axis</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header id="header">
      <div class="header-left">
        <h1>G-Axis</h1>
        <span id="connection-status" class="status-dot disconnected" title="Disconnected"></span>
      </div>
      <button id="settings-btn" class="icon-btn" title="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </header>

    <!-- Task Input -->
    <section id="input-section">
      <div class="input-wrapper">
        <textarea id="task-input" placeholder="What should I do on this page?" rows="2"></textarea>
        <div class="input-actions">
          <button id="voice-btn" class="icon-btn voice-btn" title="Voice input">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>
            </svg>
          </button>
          <button id="send-btn" class="primary-btn" disabled>Run</button>
        </div>
      </div>
      <div id="suggestions">
        <button class="suggestion" data-task="Search Google for trending tech news today">Search trending news</button>
        <button class="suggestion" data-task="Go to GitHub trending repositories">GitHub trending</button>
        <button class="suggestion" data-task="Find the weather forecast for today">Check weather</button>
      </div>
    </section>

    <!-- Live Status -->
    <section id="status-section" class="hidden">
      <div id="current-status">
        <div class="status-header">
          <span id="status-text">Idle</span>
          <button id="stop-btn" class="danger-btn small hidden">Stop</button>
        </div>
        <div id="task-instruction" class="dim"></div>
      </div>

      <!-- Screenshot preview -->
      <div id="screenshot-container" class="hidden">
        <img id="screenshot-img" alt="Browser view" />
        <div id="screenshot-overlay"></div>
      </div>
    </section>

    <!-- Approval Modal -->
    <section id="approval-section" class="hidden">
      <div class="approval-card">
        <div class="approval-header">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
          <span>Approval Required</span>
        </div>
        <p id="approval-action"></p>
        <p id="approval-reason" class="dim"></p>
        <div class="approval-meta">
          <span id="approval-risk" class="risk-badge"></span>
          <span id="approval-confidence"></span>
        </div>
        <div class="approval-actions">
          <button id="approve-btn" class="primary-btn">Approve</button>
          <button id="deny-btn" class="danger-btn">Deny</button>
        </div>
      </div>
    </section>

    <!-- Action Timeline -->
    <section id="timeline-section">
      <h3>Activity</h3>
      <div id="timeline"></div>
    </section>

    <!-- Task Complete -->
    <section id="complete-section" class="hidden">
      <div class="complete-card">
        <div id="complete-icon"></div>
        <p id="complete-summary"></p>
        <div id="complete-stats" class="dim"></div>
        <button id="new-task-btn" class="primary-btn">New Task</button>
      </div>
    </section>
  </div>

  <script src="app.js" type="module"></script>
</body>
</html>
